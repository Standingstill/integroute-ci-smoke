name: Integroute CI
run-name: Integroute CI ${{ inputs.dispatch_id }}
on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact commit approved by Integroute
        required: true
        type: string
      dispatch_id:
        description: Unique Integroute dispatch identifier
        required: true
        type: string
permissions:
  contents: read
jobs:
  build:
    if: github.sha == inputs.expected_sha
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - run: npm ci
      - run: npm test
